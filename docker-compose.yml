services:

  # =========================
  # DATABASES / INFRASTRUCTURE
  # =========================

  mysql:
    image: mysql:8.0
    container_name: queryhub-mysql
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      MYSQL_DATABASE: ${MYSQL_DATABASE}
    volumes:
      - mysql-data:/var/lib/mysql
    restart: unless-stopped

  mongodb:
    image: mongo:8
    container_name: queryhub-mongodb
    ports:
      - "27017:27017"
    volumes:
      - mongo-data:/data/db
    restart: unless-stopped

  kafka:
    image: apache/kafka:4.3.0
    container_name: queryhub-kafka
    ports:
      - "9092:9092"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller

      KAFKA_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092

      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093

      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1

      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_NUM_PARTITIONS: 3

    volumes:
      - kafka-data:/var/lib/kafka/data
    restart: unless-stopped

  elasticsearch:
    image: docker.elastic.co/elasticsearch/elasticsearch:8.19.21
    container_name: queryhub-elasticsearch
    environment:
      - discovery.type=single-node
      - xpack.security.enabled=false
      - ES_JAVA_OPTS=-Xms512m -Xmx512m
    ports:
      - "9200:9200"
    volumes:
      - elasticsearch-data:/usr/share/elasticsearch/data
    restart: unless-stopped


  # =========================
  # EUREKA
  # =========================

  eureka:
    image: queryhub-eureka:1.0
    container_name: queryhub-eureka
    ports:
      - "8761:8761"
    environment:
      SERVER_PORT: 8761
    restart: unless-stopped


  # =========================
  # AUTH SERVICE
  # =========================

  auth:
    image: queryhub-auth:1.0
    container_name: queryhub-auth
    ports:
      - "8081:8081"
    environment:
      SERVER_PORT: 8081

      DB_URL: jdbc:mysql://mysql:3306/auth
      DB_USERNAME: root
      DB_PASSWORD: ${MYSQL_ROOT_PASSWORD}

      JWT_SECRET: ${JWT_SECRET}
      JWT_EXPIRATION: ${JWT_EXPIRATION}

      EUREKA_URL: http://eureka:8761/eureka

    depends_on:
      - mysql
      - eureka

    restart: unless-stopped


  # =========================
  # QUESTION SERVICE
  # =========================

  question:
    image: queryhub-question:1.0
    container_name: queryhub-question
    ports:
      - "8082:8082"
    environment:
      SERVER_PORT: 8082

      MONGO_URI: mongodb://mongodb:27017/quora_db

      EUREKA_URL: http://eureka:8761/eureka

      SPRING_KAFKA_BOOTSTRAP_SERVERS: kafka:9092

      SPRING_ELASTICSEARCH_URIS: http://elasticsearch:9200

    depends_on:
      - mongodb
      - kafka
      - elasticsearch
      - eureka

    restart: unless-stopped


  # =========================
  # API GATEWAY
  # =========================

  gateway:
    image: queryhub-gateway:1.0
    container_name: queryhub-gateway
    ports:
      - "8080:8080"
    environment:
      SERVER_PORT: 8080

      EUREKA_URL: http://eureka:8761/eureka

      JWT_SECRET: ${JWT_SECRET}

      FRONTEND_URL: http://localhost

    depends_on:
      - eureka
      - auth
      - question

    restart: unless-stopped


  # =========================
  # FRONTEND
  # =========================

  frontend:
    image: queryhub-frontend:1.0
    container_name: queryhub-frontend
    ports:
      - "80:80"
    depends_on:
      - gateway
    restart: unless-stopped


# =========================
# VOLUMES
# =========================

volumes:
  mysql-data:
  mongo-data:
  kafka-data:
  elasticsearch-data: